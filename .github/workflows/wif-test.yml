name: WIF Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-wif:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/751378940559/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: sa-saudefamiliar-deploy@prj-saudefamiliar-pessoal-pfl.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: prj-saudefamiliar-pessoal-pfl

      - name: Validate identity and project
        shell: bash
        run: |
          echo "Project:"
          gcloud config get-value project

          echo "Authenticated account:"
          gcloud auth list --filter=status:ACTIVE --format="value(account)"

          echo "Project metadata:"
          gcloud projects describe prj-saudefamiliar-pessoal-pfl \
            --format="table(projectId,projectNumber,name,lifecycleState)"
