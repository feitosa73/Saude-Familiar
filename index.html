<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <script>
      // 1. Silent stub for Vite dev HMR & ModuleRunner WebSocket connection in iframe environment
      (function() {
        if (typeof window === 'undefined' || !window.WebSocket) return;
        var NativeWebSocket = window.WebSocket;
        function ViteSilentWebSocket(url, protocols) {
          var urlStr = String(url || '');
          var protoStr = String(protocols || '');
          // Intercept any WebSocket connection originating from Vite client / dev server
          var isViteWs =
            protoStr === 'vite-hmr' ||
            urlStr.indexOf('vite') !== -1 ||
            urlStr.indexOf('token=') !== -1 ||
            urlStr.indexOf('run.app') !== -1 ||
            urlStr.indexOf('localhost') !== -1 ||
            urlStr.indexOf('127.0.0.1') !== -1 ||
            urlStr.indexOf(':3000') !== -1 ||
            urlStr.indexOf(':24678') !== -1 ||
            urlStr.indexOf(':5173') !== -1;

          if (isViteWs) {
            var listeners = {};
            var ws = {
              OPEN: 1,
              CLOSED: 3,
              CLOSING: 2,
              CONNECTING: 0,
              readyState: 1, // ReadyState OPEN prevents the reject()
              bufferedAmount: 0,
              extensions: '',
              protocol: protocols || 'vite-hmr',
              url: url,
              binaryType: 'blob',
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null,
              send: function() {},
              close: function() {},
              addEventListener: function(type, fn) {
                if (!listeners[type]) listeners[type] = [];
                listeners[type].push(fn);
                if (type === 'open') {
                  setTimeout(function() {
                    try {
                      if (typeof ws.onopen === 'function') ws.onopen({ type: 'open' });
                      fn({ type: 'open' });
                    } catch (_) {}
                  }, 0);
                }
              },
              removeEventListener: function(type, fn) {
                if (!listeners[type]) return;
                listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
              },
              dispatchEvent: function() { return true; }
            };
            setTimeout(function() {
              try {
                if (typeof ws.onopen === 'function') ws.onopen({ type: 'open' });
              } catch (_) {}
            }, 0);
            return ws;
          }
          return new NativeWebSocket(url, protocols);
        }
        ViteSilentWebSocket.prototype = NativeWebSocket.prototype;
        ViteSilentWebSocket.CONNECTING = 0;
        ViteSilentWebSocket.OPEN = 1;
        ViteSilentWebSocket.CLOSING = 2;
        ViteSilentWebSocket.CLOSED = 3;
        window.WebSocket = ViteSilentWebSocket;
      })();

      // 2. Suppress benign Vite WebSocket/HMR runner errors in preview iframe environment
      window.addEventListener('error', function(event) {
        var msg = String(event && (event.message || (event.error && (event.error.message || event.error.stack)) || ''));
        var filename = String(event && event.filename || '');
        if (
          msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('@vite/client') !== -1 ||
          filename.indexOf('@vite/client') !== -1
        ) {
          if (event.preventDefault) event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var reasonMsg = String((reason && (reason.stack || reason.message)) || reason || '');
        if (
          reasonMsg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
          reasonMsg.indexOf('WebSocket') !== -1 ||
          reasonMsg.indexOf('@vite/client') !== -1
        ) {
          if (event.preventDefault) event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      }, true);

      var prevOnError = window.onerror;
      window.onerror = function(msg, url, line, col, error) {
        var text = String(msg || '') + ' ' + String(url || '') + ' ' + String(error && error.stack || '');
        if (
          text.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
          text.indexOf('@vite/client') !== -1 ||
          text.indexOf('WebSocket') !== -1
        ) {
          return true;
        }
        if (prevOnError) return prevOnError.apply(this, arguments);
      };
    </script>
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SaúdeFamiliar" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Saúde Familiar - Prontuário & Cuidado do Idoso</title>
    <meta name="description" content="Aplicação para organização e centralização privada de informações de saúde de familiares idosos." />
    <meta property="og:title" content="Saúde Familiar" />
    <meta property="og:description" content="Organização de medicamentos, consultas, exames e histórico de saúde familiar." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
